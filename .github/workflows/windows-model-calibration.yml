name: Bounded native Windows warm benchmark
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Selected bounded performance probe; all runs the protocol matrix
        required: true
        default: tg128-1500
        type: choice
        options: [remaining, pp500, pp1500, pp3000, tg128, tg128-1500, tg128-3000, full-context, thermal, all]
      ballast:
        description: Owned ballast GiB; unsafe cases are rejected before model download
        required: true
        default: '0'
        type: choice
        options: ['0', '2', '4']
permissions:
  contents: read
jobs:
  warm-benchmark:
    runs-on: windows-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        probe: ${{ fromJSON(inputs.probe == 'remaining' && '["pp3000","full-context","thermal"]' || inputs.probe == 'all' && '["pp500","pp1500","pp3000","tg128","tg128-1500","tg128-3000","full-context","thermal"]' || format('["{0}"]', inputs.probe || 'tg128-1500')) }}
        ballast: ${{ fromJSON(format('[{0}]', inputs.ballast || '0')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Enable Defender real-time protection for this disposable benchmark runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          $record = [ordered]@{ status = 'NOT VALIDATED'; setting_changes = @(); error = $null }
          try {
            $record.before = [bool](Get-MpComputerStatus).RealTimeProtectionEnabled
            if (-not $record.before) {
              Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop
              $record.setting_changes += 'Requested real-time protection ON; never disabled security'
              for ($i = 0; $i -lt 10; $i++) {
                if ((Get-MpComputerStatus).RealTimeProtectionEnabled) { break }
                Start-Sleep -Seconds 1
              }
            }
            $record.after = [bool](Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($record.after) { $record.status = 'MEASURED Defender real-time ON' }
          } catch { $record.error = $_.Exception.Message }
          $record | ConvertTo-Json -Depth 8 | Set-Content work/defender.json -Encoding utf8NoBOM
          $record | ConvertTo-Json -Depth 8 | Write-Output
      - name: Verify the explicit environment and owned process before model download
        shell: pwsh
        run: |
          ./scripts/bench/windows-model-calibration.ps1 -ProbeOnly -ResultDirectory work/calibration-process-probe
          $probeCode = $LASTEXITCODE
          $report = Get-Content work/calibration-process-probe/run-manifest.json -Raw | ConvertFrom-Json
          $report | ConvertTo-Json -Depth 12 | Write-Output
          if ($probeCode -ne 0) { throw 'Tiny owned process and explicit offline environment probe failed; see bounded manifest above' }
          if (-not $report.safety.explicit_offline_child_environment.StartsWith('MEASURED')) { throw 'Explicit child environment was not verified' }
          $report.safety | ConvertTo-Json -Depth 12 | Write-Output
      - name: Measure selected case within the enforced memory envelope
        shell: pwsh
        run: |
          ./scripts/bench/windows-model-calibration.ps1 -WarmBenchmark -ProbeSet '${{ matrix.probe }}' -WarmupRuns 3 -Repetitions 30 -BallastGiB ${{ matrix.ballast }} -TimeoutSeconds 1800 -BenchmarkTimeoutSeconds $(if ('${{ matrix.probe }}' -eq 'thermal') { 1200 } else { 18000 }) -ResultDirectory work/calibration
          $code = $LASTEXITCODE
          if ($code -eq 2 -and '${{ matrix.ballast }}' -ne '0') {
            $manifest = Get-Content work/calibration/run-manifest.json -Raw | ConvertFrom-Json
            if ($manifest.status -ne 'NOT_ADMITTED' -or $null -ne $manifest.owned_pid) { throw 'Unexpected ballast rejection state' }
            Write-Output 'Requested ballast safely NOT_ADMITTED; no performance claim for this case'
            exit 0
          }
          if ($code -ne 0) { throw "Selected benchmark did not complete: $code" }
      - name: Log capability manifest
        if: always()
        shell: pwsh
        run: |
          if (Test-Path work/calibration/run-manifest.json) {
            Write-Output 'CAPABILITY_JSON_BEGIN run-manifest.json'
            Get-Content work/calibration/run-manifest.json -Raw | Write-Output
            Write-Output 'CAPABILITY_JSON_END run-manifest.json'
          }
      - name: Retain metadata and memory samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-windows-benchmark-${{ matrix.probe }}-ballast${{ matrix.ballast }}-metadata
          path: |
            work/calibration/run-manifest.json
            work/calibration/memory.jsonl
            work/calibration/benchmark.jsonl
            work/defender.json
          retention-days: 7
          if-no-files-found: warn
      - name: Check logs are safe to retain
        id: safe-logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path work/calibration/run-manifest.json) {
            $manifest = Get-Content work/calibration/run-manifest.json -Raw | ConvertFrom-Json
            if ($manifest.artifact_logs_safe -eq $true) { 'safe=true' >> $env:GITHUB_OUTPUT }
          }
      - name: Retain explicitly checked native logs
        if: always() && steps.safe-logs.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-windows-benchmark-${{ matrix.probe }}-ballast${{ matrix.ballast }}-native-logs
          path: |
            work/calibration/native.stdout.log
            work/calibration/native.stderr.log
          retention-days: 7
          if-no-files-found: warn
